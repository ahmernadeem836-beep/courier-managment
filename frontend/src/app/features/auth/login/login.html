
<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4 py-10">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 text-white text-2xl font-bold shadow-lg shadow-blue-200">
        C
      </div>

      <h1 class="mt-4 text-3xl font-bold text-slate-800">
        CourierPro
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Courier Management System
      </p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200 p-8">

      <div class="mb-7">
        <h2 class="text-2xl font-bold text-slate-800">
          Welcome Back
        </h2>

        <p class="mt-2 text-sm text-slate-500">
          Sign in to access your account
        </p>
      </div>

      <form (ngSubmit)="onLogin()" class="space-y-5">

        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">
            Email Address
          </label>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">
            Password
          </label>

          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 pr-16 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
            />

            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-semibold text-blue-600 hover:text-blue-700"
            >
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <!-- Error Message -->
        @if (errorMessage) {
          <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-600">
            {{ errorMessage }}
          </div>
        }

        <!-- Login Button -->
        <button
          type="submit"
          class="w-full rounded-xl bg-blue-600 py-3.5 text-sm font-semibold text-white shadow-lg shadow-blue-200 transition hover:bg-blue-700 active:scale-[0.99]"
        >
          Sign In
        </button>

      </form>

      <!-- Merchant Registration Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-slate-500">
          Don't have a merchant account?
        </p>

        <a
          routerLink="/merchant/register"
          class="mt-2 inline-block text-sm font-semibold text-blue-600 hover:text-blue-700"
        >
          Register your business
        </a>
      </div>

    </div>

    <!-- Footer -->
    <p class="mt-7 text-center text-xs text-slate-400">
      © 2026 CourierPro. All rights reserved.
    </p>

  </div>

</div>
