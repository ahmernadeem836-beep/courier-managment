<aside class="flex h-screen w-64 flex-col bg-slate-950 text-white">

  <!-- Logo -->
  <div class="flex h-20 shrink-0 items-center gap-3 border-b border-slate-800 px-6">
    <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-600 text-xl font-bold">
      C
    </div>

    <div>
      <h1 class="text-lg font-bold tracking-wide">CourierPro</h1>
      <p class="text-xs text-slate-400">Merchant Portal</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 space-y-2 overflow-y-auto px-4 py-6">

    <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-slate-500">
      Workspace
    </p>

    <a routerLink="/merchant/dashboard"
       routerLinkActive="bg-blue-600 text-white"
       [routerLinkActiveOptions]="{ exact: true }"
       class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
      <span>▦</span>
      Dashboard
    </a>

    <a routerLink="/merchant/create-shipment"
       routerLinkActive="bg-blue-600 text-white"
       class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
      <span>＋</span>
      Create Shipment
    </a>

    <a routerLink="/merchant/shipments"
       routerLinkActive="bg-blue-600 text-white"
       class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
      <span>□</span>
      My Shipments
    </a>

    <a routerLink="/merchant/tracking"
       routerLinkActive="bg-blue-600 text-white"
       class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
      <span>⌖</span>
      Shipment Tracking
    </a>

    <div class="my-5 border-t border-slate-800"></div>

    <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-slate-500">
      Account
    </p>

    <a routerLink="/merchant/profile"
       routerLinkActive="bg-blue-600 text-white"
       class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
      <span>○</span>
      My Profile
    </a>

  </nav>

  <!-- Footer -->
  <div class="shrink-0 border-t border-slate-800 p-4">
    <p class="text-xs text-slate-400">Merchant Workspace</p>
    <p class="mt-1 text-sm font-medium text-white">Courier Management</p>
  </div>

</aside>
