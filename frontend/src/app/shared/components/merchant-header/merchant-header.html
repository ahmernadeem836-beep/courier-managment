<header class="sticky top-0 z-30 flex h-20 items-center justify-between border-b border-slate-200 bg-white px-8">

  <!-- Page Title -->
  <div>
    <h1 class="text-xl font-bold text-slate-800">
      {{ pageTitle() }}
    </h1>
    <p class="mt-1 text-xs text-slate-500">
      Manage your shipments and business operations
    </p>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-5">

    <!-- Notifications -->
    <div class="relative">
      <button
        (click)="toggleNotifications()"
        class="relative flex h-10 w-10 items-center justify-center rounded-full text-xl text-slate-600 transition hover:bg-slate-100">
        ♧
        <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-red-500"></span>
      </button>

      @if (showNotifications) {
        <div class="absolute right-0 top-12 w-72 rounded-xl border border-slate-200 bg-white p-4 shadow-xl">
          <h3 class="font-semibold text-slate-800">Notifications</h3>
          <p class="mt-3 text-sm text-slate-500">
            You're all caught up!
          </p>
        </div>
      }
    </div>

    <!-- Profile -->
    
<!-- Profile -->
<div class="relative">
  <button
    (click)="toggleProfileMenu()"
    class="flex items-center gap-3 rounded-xl px-3 py-2 transition hover:bg-slate-100">

    <div class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 font-bold text-blue-700">
      {{ currentUser?.name?.charAt(0) || 'M' }}
    </div>

    <div class="text-left">
      <p class="text-sm font-semibold text-slate-800">
        {{ currentUser?.name || 'Merchant User' }}
      </p>

      <p class="text-xs text-slate-500">
        {{ currentUser?.email || 'Merchant Account' }}
      </p>
    </div>

    <span class="text-xs text-slate-500">⌄</span>
  </button>

  @if (showProfileMenu) {
    <div class="absolute right-0 top-14 w-48 rounded-xl border border-slate-200 bg-white p-2 shadow-xl">

      <a
        routerLink="/merchant/profile"
        class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100">
        My Profile
      </a>

      <button
        (click)="logout()"
        class="w-full rounded-lg px-3 py-2 text-left text-sm text-red-600 hover:bg-red-50">
        Logout
      </button>

    </div>
  }
</div>


      
  </div>
</header>
