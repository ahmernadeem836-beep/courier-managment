
<!-- Profile -->
<div class="relative border-l border-slate-200 pl-5">

  <button
    type="button"
    (click)="toggleProfile()"
    class="flex items-center gap-3 rounded-lg p-1 hover:bg-slate-50 transition-colors">

    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold">
      {{ currentUser?.name?.charAt(0) || 'U' }}
    </div>

    <div class="text-left">
      <p class="text-sm font-semibold text-slate-800">
        {{ currentUser?.name || 'Guest User' }}
      </p>

      <p class="text-xs text-slate-500">
        {{ currentUserRole || 'Not Logged In' }}
      </p>
    </div>

    <span class="text-slate-400 text-xs">▼</span>
  </button>

  @if (profileOpen) {
    <div class="absolute right-0 top-full mt-3 w-60 bg-white border border-slate-200 rounded-xl shadow-xl z-50 overflow-hidden">

      <div class="px-4 py-4 border-b border-slate-100">
        <p class="text-sm font-semibold text-slate-800">
          {{ currentUser?.name }}
        </p>

        <p class="text-xs text-slate-500 mt-1">
          {{ currentUser?.email }}
        </p>

        <p class="text-xs text-blue-600 mt-1">
          {{ currentUserRole }}
        </p>
      </div>

      <div class="p-2">

        <div class="px-3 py-2.5 text-sm text-slate-600 rounded-lg">
          My Profile
        </div>

        <div class="px-3 py-2.5 text-sm text-slate-600 rounded-lg">
          Account Settings
        </div>

        <div class="border-t border-slate-100 my-2"></div>

        <button
          type="button"
          (click)="logout()"
          class="w-full text-left px-3 py-2.5 text-sm text-red-600 hover:bg-red-50 rounded-lg">
          Logout
        </button>

      </div>
    </div>
  }

</div>
