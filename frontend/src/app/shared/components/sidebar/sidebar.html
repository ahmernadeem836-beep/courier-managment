
<aside class="w-64 min-h-screen bg-slate-950 text-slate-300 flex flex-col">

  <!-- Logo -->
  <div class="h-20 flex items-center px-6 border-b border-slate-800">
    <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-xl font-bold">
      C
    </div>

    <div class="ml-3">
      <h1 class="text-lg font-bold text-white">CourierPro</h1>
      <p class="text-xs text-slate-400">Management System</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 space-y-7 overflow-y-auto">

    @for (group of menuGroups; track group.title) {
      <div>
        <p class="text-xs font-semibold text-slate-500 tracking-wider px-3 mb-3">
          {{ group.title }}
        </p>

        <div class="space-y-1">
          @for (item of group.items; track item.route) {
            <a
  [routerLink]="item.route"
  routerLinkActive="bg-blue-600 text-white"
  class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
         hover:bg-slate-800 hover:text-white transition-colors"
>
              <span class="w-5 text-center text-lg">{{ item.icon }}</span>
              <span>{{ item.label }}</span>
            </a>
          }
        </div>
      </div>
    }

  </nav>

  <!-- Footer -->
  <div class="p-4 border-t border-slate-800">
    <p class="text-xs text-slate-500">CourierPro System</p>
    <p class="text-xs text-slate-400 mt-1">Version 1.0</p>
  </div>

</aside>
